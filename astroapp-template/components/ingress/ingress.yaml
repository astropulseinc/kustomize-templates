apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "10"
    # cert-manager issues a per-host certificate into spec.tls[].secretName.
    # Without this the referenced tls-secret never exists and nginx serves
    # its Fake Certificate for every app endpoint.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - UPDATE
      secretName: tls-secret
  rules:
  - host: UPDATE
    http:
      paths:
      - path: /
        backend:
          service:
            name: app
            port:
              number: 80
        pathType: Prefix
